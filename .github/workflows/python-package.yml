name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: ios-sweet-portability
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CI linter
        run: python -m pip install flake8
      - name: Lint for syntax errors and undefined names
        run: python -m flake8 devicecheck tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test with the Python standard library
        run: python -m unittest discover -s tests -v
