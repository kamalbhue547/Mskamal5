name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package and quality tools
        run: python -m pip install -e . flake8 'mypy==1.20.2' build
      - name: Lint for syntax errors and undefined names
        run: python -m flake8 ios-sweet-portability/devicecheck ios-sweet-portability/tests test_repository.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Type-check application and test bodies
        run: python -m mypy --check-untyped-defs ios-sweet-portability/devicecheck ios-sweet-portability/tests test_repository.py
      - name: Verify root test discovery and run tests
        run: |
          python -c 'import unittest; count = unittest.defaultTestLoader.discover(".").countTestCases(); print(f"Discovered {count} tests"); assert count > 0, "No tests discovered"'
          python -m unittest discover -v
      - name: Verify the project checkout still works directly
        working-directory: ios-sweet-portability
        run: python -m unittest discover -s tests -q
      - name: Verify editable CLI from the repository root
        run: |
          python -m devicecheck --help
          devicecheck --version
          devicecheck --list-profiles
      - name: Test the sdist and its installed wheel outside the checkout
        run: |
          python -m build --sdist --outdir "$RUNNER_TEMP/sdist" .
          mkdir -p "$RUNNER_TEMP/sdist-source"
          tar -xzf "$RUNNER_TEMP"/sdist/*.tar.gz -C "$RUNNER_TEMP/sdist-source"
          (cd "$RUNNER_TEMP"/sdist-source/* && python -m unittest discover -q)
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" "$RUNNER_TEMP"/sdist/*.tar.gz
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/devicecheck" --version
          "$RUNNER_TEMP/wheel-venv/bin/devicecheck" --list-profiles
          "$RUNNER_TEMP/wheel-venv/bin/python" -I -c 'import sys; from pathlib import Path; import devicecheck; assert Path(devicecheck.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())'
          "$RUNNER_TEMP/wheel-venv/bin/python" -I -c 'from importlib.resources import files; from devicecheck.profiles import load_profiles; assert files("devicecheck").joinpath("py.typed").is_file(); assert any(p.id == "sweet" for p in load_profiles())'
          "$RUNNER_TEMP/wheel-venv/bin/python" -I -c 'from importlib.metadata import metadata; data = metadata("ios-sweet-devicecheck"); assert data["License-Expression"] == "MIT"; assert data.get_all("Requires-Dist") is None'
